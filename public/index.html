<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Voice App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- FIRST START -->
<div id="setup">
    <div class="box">
        <h2>Ersteinrichtung</h2>
        <input id="name" placeholder="Name">
        <input id="avatar" type="file">
        <button id="saveSetup">Speichern</button>
    </div>
</div>

<!-- DSGVO -->
<div id="privacy">
    <div class="box">
        <h2>Datenschutz</h2>
        <p>Mikrofon wird nur nach Zustimmung genutzt.</p>
        <button id="accept">Zustimmen</button>
    </div>
</div>

<!-- APP -->
<h2 style="padding:10px">Voice Room</h2>

<button id="join">Join</button>
<button id="mute">Mute</button>

<div id="participants"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
